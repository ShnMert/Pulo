<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kontakt – Pulo</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-96.png" sizes="96x96" type="image/png">
  <script>try{var m=localStorage.getItem("pulo-theme");if(m==="light"||m==="dark")document.documentElement.dataset.theme=m}catch(e){}</script>
  <style>
    :root { --bg:#f5f7f8; --bg-elev:#fff; --text:#10181c; --text-2:#4a5961; --accent:#2f5fd6; --accent-ink:#fff; --line:rgba(16,24,28,.14); }
    :root[data-theme="dark"] { color-scheme:dark; --bg:#0b1114; --bg-elev:#131b1f; --text:#eef3f4; --text-2:#a3b1b7; --accent:#8fb0ff; --accent-ink:#0a1633; --line:rgba(255,255,255,.14); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme:dark; --bg:#0b1114; --bg-elev:#131b1f; --text:#eef3f4; --text-2:#a3b1b7; --accent:#8fb0ff; --accent-ink:#0a1633; --line:rgba(255,255,255,.14); } }
    body { margin:0; background:var(--bg); color:var(--text); font:17px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif; -webkit-font-smoothing:antialiased; }
    main { width:min(720px, 100% - 2.5rem); margin:0 auto; padding:4rem 0; }
    h1 { font-size:clamp(2rem, 5vw, 3rem); letter-spacing:-.025em; margin:0 0 1rem; }
    p { color:var(--text-2); }
    a { color:var(--accent); }
    :focus-visible { outline:3px solid var(--accent); outline-offset:3px; border-radius:6px; }
    form { display:grid; gap:1.1rem; margin-top:2rem; }
    label { display:block; margin-bottom:.35rem; font-weight:600; font-size:.95rem; color:var(--text); }
    input, select, textarea { width:100%; box-sizing:border-box; min-height:48px; padding:.7rem 1rem; border-radius:14px; border:1px solid var(--line); background:var(--bg-elev); color:var(--text); font:inherit; }
    textarea { min-height:150px; resize:vertical; }
    .hp { position:absolute; left:-9999px; }
    .note { margin:0; font-size:.88rem; }
    button { justify-self:start; min-height:48px; padding:.7rem 1.6rem; border:0; border-radius:999px; background:var(--accent); color:var(--accent-ink); font:inherit; font-weight:600; cursor:pointer; }
    button:hover { filter:brightness(1.08); }
  </style>
</head>
<body>
  <main>
    <p><a href="/">← Zurück zu Pulo</a></p>
    <h1>Kontakt</h1>
    <p>Frage, Idee oder Fehler gefunden? Schreib uns, wir lesen jede Nachricht.</p>
    <form name="kontaktformular" method="POST" action="/kontakt-danke" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="kontaktformular">
      <input type="hidden" name="sprache" value="de">
      <p class="hp" aria-hidden="true"><label>Nicht ausfüllen: <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
      <div><label for="name">Name</label><input id="name" name="name" autocomplete="name" maxlength="100" required></div>
      <div><label for="email">E-Mail-Adresse</label><input type="email" id="email" name="email" autocomplete="email" maxlength="200" required></div>
      <div>
        <label for="anliegen">Worum geht es?</label>
        <select id="anliegen" name="anliegen" required>
          <option value="" disabled selected>Bitte auswählen</option>
          <option value="Frage zu Pulo">Frage zu Pulo</option>
          <option value="Fehler melden">Fehler melden</option>
          <option value="Idee oder Funktionswunsch">Idee oder Funktionswunsch</option>
          <option value="Pro und Kauf">Pro und Kauf</option>
          <option value="Windows-Version">Windows-Version</option>
          <option value="Sonstiges">Sonstiges</option>
        </select>
      </div>
      <div><label for="nachricht">Deine Nachricht</label><textarea id="nachricht" name="nachricht" maxlength="3000" required></textarea></div>
      <p class="note">Mit dem Absenden verarbeiten wir deine Angaben, um dir zu antworten. Mehr dazu in der <a href="/datenschutz">Datenschutzerklärung</a>.</p>
      <button type="submit">Nachricht senden</button>
    </form>
  </main>
</body>
</html>
