<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 289 347" width="289" height="347" role="img" aria-label="Freundlicher blauer Roboter" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7aa8ff"/>
      <stop offset="1" stop-color="#3f6fe6"/>
    </linearGradient>
    <linearGradient id="blueSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5f8df5"/>
      <stop offset="1" stop-color="#3a63d6"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d5fc4"/>
      <stop offset="1" stop-color="#2c479f"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e141c"/>
      <stop offset="1" stop-color="#171d28"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#8fb0ff"/>
      <stop offset="1" stop-color="#3f68d8"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2a3a66" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2a3a66" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Schatten -->
  <ellipse cx="145" cy="335" rx="85" ry="9" fill="url(#shadow)"/>

  <!-- Antenne -->
  <rect x="139.500" y="48" width="6" height="36" rx="3" fill="#3f6fe6"/>
  <circle cx="142" cy="43" r="9" fill="url(#blue)"/>

  <!-- Ohren -->
  <rect x="22" y="146" width="30" height="56" rx="13" fill="url(#ear)"/>
  <rect x="236" y="146" width="30" height="56" rx="13" fill="url(#ear)"/>

  <!-- Füße -->
  <ellipse cx="104" cy="322" rx="23" ry="12" fill="#3a63d6"/>
  <ellipse cx="186" cy="322" rx="23" ry="12" fill="#3a63d6"/>

  <!-- Arme -->
  <rect x="58" y="240" width="30" height="66" rx="15" fill="url(#blueSide)"/>
  <rect x="198" y="240" width="30" height="66" rx="15" fill="url(#blueSide)"/>

  <!-- Körper -->
  <rect x="86" y="228" width="116" height="88" rx="42" fill="url(#blue)"/>
  <circle cx="143" cy="273" r="12" fill="#8db3ff"/>
  <circle cx="141" cy="270" r="5" fill="#c4d8ff" opacity="0.8"/>

  <!-- Kopf -->
  <rect x="50" y="76" width="188" height="160" rx="62" fill="url(#blue)"/>

  <!-- Bildschirm -->
  <rect x="62" y="90" width="164" height="134" rx="52" fill="url(#screen)"/>

  <!-- Augenbrauen -->
  <rect x="84" y="118" width="38" height="7" rx="3.500" fill="#8fb0ff"/>
  <rect x="166" y="118" width="38" height="7" rx="3.500" fill="#8fb0ff"/>

  <!-- Augen -->
  <circle cx="104" cy="162" r="26" fill="#f4f7ff"/>
  <circle cx="106" cy="164" r="17" fill="url(#iris)"/>
  <circle cx="107" cy="165" r="8" fill="#0c1118"/>
  <circle cx="100" cy="157" r="4" fill="#fff"/>
  <circle cx="112" cy="172" r="2" fill="#fff" opacity="0.8"/>

  <circle cx="184" cy="162" r="26" fill="#f4f7ff"/>
  <circle cx="182" cy="164" r="17" fill="url(#iris)"/>
  <circle cx="181" cy="165" r="8" fill="#0c1118"/>
  <circle cx="175" cy="157" r="4" fill="#fff"/>
  <circle cx="187" cy="172" r="2" fill="#fff" opacity="0.8"/>

  <!-- Wangen -->
  <ellipse cx="79" cy="190" rx="9" ry="6" fill="#4a2a5a" opacity="0.35"/>
  <ellipse cx="209" cy="190" rx="9" ry="6" fill="#4a2a5a" opacity="0.35"/>

  <!-- Lächeln -->
  <path d="M120 201 Q144 210 168 201" fill="none" stroke="#f4f7ff" stroke-width="4.500" stroke-linecap="round"/>
</svg>
