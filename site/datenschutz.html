<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Datenschutz – Pulo</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-96.png" sizes="96x96" type="image/png">
  <script>try{var m=localStorage.getItem("pulo-theme");if(m==="light"||m==="dark")document.documentElement.dataset.theme=m}catch(e){}</script>
  <style>
    :root { --bg:#f5f7f8; --text:#10181c; --text-2:#4a5961; --accent:#2f5fd6; }
    :root[data-theme="dark"] { color-scheme:dark; --bg:#0b1114; --text:#eef3f4; --text-2:#a3b1b7; --accent:#8fb0ff; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme:dark; --bg:#0b1114; --text:#eef3f4; --text-2:#a3b1b7; --accent:#8fb0ff; } }
    body { margin:0; background:var(--bg); color:var(--text); font:17px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif; -webkit-font-smoothing:antialiased; }
    main { width:min(720px, 100% - 2.5rem); margin:0 auto; padding:4rem 0; }
    h1 { font-size:clamp(2rem, 5vw, 3rem); letter-spacing:-.025em; margin:0 0 1rem; }
    p { color:var(--text-2); }
    a { color:var(--accent); }
    :focus-visible { outline:3px solid var(--accent); outline-offset:3px; border-radius:6px; }
  </style>
</head>
<body>
  <main>
    <p><a href="./">← Zurück zu Pulo</a></p>
    <h1>Datenschutz</h1>
    <!-- BORAN: Rechtstext für „Datenschutz“ hier einfügen -->
    <p>Dieser Inhalt wird gerade vorbereitet.</p>
  </main>
</body>
</html>
