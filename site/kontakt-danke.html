<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Danke – Pulo</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-96.png" sizes="96x96" type="image/png">
  <script>try{var m=localStorage.getItem("pulo-theme");if(m==="light"||m==="dark")document.documentElement.dataset.theme=m}catch(e){}</script>
  <style>
    :root { --bg:#f5f7f8; --bg-elev:#fff; --text:#10181c; --text-2:#4a5961; --accent:#2f5fd6; --accent-ink:#fff; --line:rgba(16,24,28,.14); }
    :root[data-theme="dark"] { color-scheme:dark; --bg:#0b1114; --bg-elev:#131b1f; --text:#eef3f4; --text-2:#a3b1b7; --accent:#8fb0ff; --accent-ink:#0a1633; --line:rgba(255,255,255,.14); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme:dark; --bg:#0b1114; --bg-elev:#131b1f; --text:#eef3f4; --text-2:#a3b1b7; --accent:#8fb0ff; --accent-ink:#0a1633; --line:rgba(255,255,255,.14); } }
    body { margin:0; background:var(--bg); color:var(--text); font:17px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif; -webkit-font-smoothing:antialiased; }
    main { width:min(720px, 100% - 2.5rem); margin:0 auto; padding:4rem 0; }
    h1 { font-size:clamp(2rem, 5vw, 3rem); letter-spacing:-.025em; margin:0 0 1rem; }
    p { color:var(--text-2); }
    a { color:var(--accent); }
    :focus-visible { outline:3px solid var(--accent); outline-offset:3px; border-radius:6px; }
    form { display:grid; gap:1.1rem; margin-top:2rem; }
    label { display:block; margin-bottom:.35rem; font-weight:600; font-size:.95rem; color:var(--text); }
    input, select, textarea { width:100%; box-sizing:border-box; min-height:48px; padding:.7rem 1rem; border-radius:14px; border:1px solid var(--line); background:var(--bg-elev); color:var(--text); font:inherit; }
    textarea { min-height:150px; resize:vertical; }
    .hp { position:absolute; left:-9999px; }
    .note { margin:0; font-size:.88rem; }
    button { justify-self:start; min-height:48px; padding:.7rem 1.6rem; border:0; border-radius:999px; background:var(--accent); color:var(--accent-ink); font:inherit; font-weight:600; cursor:pointer; }
    button:hover { filter:brightness(1.08); }

    body { background:radial-gradient(60rem 36rem at 50% 12%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 60%), var(--bg); min-height:100vh; }
    main { text-align:center; padding:2.5rem 0 4rem; }
    .buddy { width:min(250px, 62vw); height:auto; overflow:visible; animation:bob 3.4s ease-in-out infinite; }
    .arm { transform-origin:213px 250px; animation:wave 1.1s ease-in-out infinite; }
    .eyes { transform-origin:144px 162px; animation:blink 5s infinite; }
    .sp { transform-box:fill-box; transform-origin:center; animation:tw 2.4s ease-in-out infinite; }
    h1 { background:linear-gradient(90deg, var(--accent), #ffd36e); -webkit-background-clip:text; background-clip:text; color:transparent; margin:.4rem 0 .6rem; }
    .lead { font-size:1.2rem; margin:0 auto; max-width:30ch; }
    .btn { display:inline-block; margin-top:1.8rem; padding:.85rem 1.9rem; border-radius:999px; background:var(--accent); color:var(--accent-ink); font-weight:700; text-decoration:none; box-shadow:0 8px 24px -8px color-mix(in srgb, var(--accent) 70%, transparent); transition:transform .2s; }
    .btn:hover { transform:translateY(-2px); }
    @keyframes wave { 0%,100% { transform:rotate(-95deg); } 50% { transform:rotate(-140deg); } }
    @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
    @keyframes blink { 0%,92%,100% { transform:scaleY(1); } 95% { transform:scaleY(.08); } }
    @keyframes tw { 0%,100% { opacity:.25; transform:scale(.7); } 50% { opacity:1; transform:scale(1.1); } }
    @media (prefers-reduced-motion: reduce) { .buddy, .arm, .eyes, .sp { animation:none; } .sp { opacity:1; } .arm { transform:rotate(-115deg); } }
  </style>
</head>
<body>
  <main>
    <svg class="buddy" viewBox="-20 -10 330 357" role="img" aria-label="Pulo winkt dir zu">
      <defs>
        <linearGradient id="b1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7aa8ff"/><stop offset="1" stop-color="#3f6fe6"/></linearGradient>
        <linearGradient id="b2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5f8df5"/><stop offset="1" stop-color="#3a63d6"/></linearGradient>
        <linearGradient id="b3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d5fc4"/><stop offset="1" stop-color="#2c479f"/></linearGradient>
        <linearGradient id="b4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e141c"/><stop offset="1" stop-color="#171d28"/></linearGradient>
        <radialGradient id="b5" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#8fb0ff"/><stop offset="1" stop-color="#3f68d8"/></radialGradient>
      </defs>
      <g class="sp" style="animation-delay:0s"><path d="M-8 60l4 11 11 4-11 4-4 11-4-11-11-4 11-4z" fill="#8fb0ff"/></g>
      <g class="sp" style="animation-delay:.8s"><path d="M290 50l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#ffd36e"/></g>
      <g class="sp" style="animation-delay:1.5s"><path d="M-2 250l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#ffd36e"/></g>
      <g class="sp" style="animation-delay:.4s"><path d="M280 300l4 11 11 4-11 4-4 11-4-11-11-4 11-4z" fill="#8fb0ff"/></g>
      <rect x="139.5" y="48" width="6" height="36" rx="3" fill="#3f6fe6"/>
      <circle class="tip" cx="142" cy="43" r="9" fill="url(#b1)"/>
      <rect x="22" y="146" width="30" height="56" rx="13" fill="url(#b3)"/>
      <rect x="236" y="146" width="30" height="56" rx="13" fill="url(#b3)"/>
      <ellipse cx="104" cy="322" rx="23" ry="12" fill="#3a63d6"/><ellipse cx="186" cy="322" rx="23" ry="12" fill="#3a63d6"/>
      <rect x="58" y="240" width="30" height="66" rx="15" fill="url(#b2)"/>
      <rect x="86" y="228" width="116" height="88" rx="42" fill="url(#b1)"/>
      <circle cx="143" cy="273" r="12" fill="#8db3ff"/><circle cx="141" cy="270" r="5" fill="#c4d8ff" opacity=".8"/>
      <g class="arm"><rect x="198" y="240" width="30" height="66" rx="15" fill="url(#b2)"/></g>
      <rect x="50" y="76" width="188" height="160" rx="62" fill="url(#b1)"/>
      <rect x="62" y="90" width="164" height="134" rx="52" fill="url(#b4)"/>
      <rect x="84" y="118" width="38" height="7" rx="3.5" fill="#8fb0ff"/><rect x="166" y="118" width="38" height="7" rx="3.5" fill="#8fb0ff"/>
      <g class="eyes">
        <circle cx="104" cy="162" r="26" fill="#f4f7ff"/><circle cx="106" cy="164" r="17" fill="url(#b5)"/><circle cx="107" cy="165" r="8" fill="#0c1118"/><circle cx="100" cy="157" r="4" fill="#fff"/><circle cx="112" cy="172" r="2" fill="#fff" opacity=".8"/>
        <circle cx="184" cy="162" r="26" fill="#f4f7ff"/><circle cx="182" cy="164" r="17" fill="url(#b5)"/><circle cx="181" cy="165" r="8" fill="#0c1118"/><circle cx="175" cy="157" r="4" fill="#fff"/><circle cx="187" cy="172" r="2" fill="#fff" opacity=".8"/>
      </g>
      <ellipse cx="79" cy="190" rx="9" ry="6" fill="#ff7aa8" opacity=".4"/><ellipse cx="209" cy="190" rx="9" ry="6" fill="#ff7aa8" opacity=".4"/>
      <path d="M116 199 Q144 218 172 199" fill="none" stroke="#f4f7ff" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <h1>Danke für deine Nachricht!</h1>
    <p class="lead">Wir haben sie erhalten und melden uns bald bei dir.</p>
    <a class="btn" href="/">Zurück zu Pulo</a>
  </main>
</body>
</html>
